name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR makes the older run pointless, so PR runs share a group
# and cancel. Each push to main gets a group of its own: GitHub keeps only one
# pending run per group, so a shared group would silently drop a queued main
# run whenever another merge landed behind it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The PR title becomes the squash commit, and release-please reads only that:
  # a title without a conventional-commit type lands as a subject it does not
  # count, and the change is silently left out of the release.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            build
            ci
            perf

  # Formatting, lints, and the per-game build matrix. The matrix matters more
  # than it looks: each downloadable game is a separate binary built with one
  # game selected, and a change that only compiles when everything is enabled
  # would not be caught by `cargo test` alone.
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: rust
      - run: just check-rust
      # --all-features so the dictionary builder, off by default because it must
      # never reach the browser, is still covered by its golden tests.
      - run: just test-rust

  # Type-checks and unit tests for everything JavaScript, plus the WASM the app
  # is built from. This job is also what proves the committed artifacts are
  # still the ones the signed manifest names.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (wasm32)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.13.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: rust
      - run: just install
      # Builds the WASM the type-checker and the tests both read.
      - run: just build
      - run: just check-ts
      - run: just test-ts

  e2e-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Split in two to halve the wall clock; a full run is long enough that a
    # red shard should not wait on a green one.
    #
    # This comment used to say the split existed because the Worker was being
    # killed for memory on a seven-gigabyte runner. That was a reasonable read
    # of the symptom — every test after a point failing on a connection error —
    # but it was wrong, and it cost a while to find out. The Worker was exiting
    # because `wrangler dev`'s ProxyWorker treats a severed client connection as
    # fatal; `e2e/playwright.config.ts` has the diagnosis and the repair. Memory
    # was never measured to be the cause, so it is no longer claimed as one.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (wasm32)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.13.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: rust
      - run: just install
      - name: Resolve installed Playwright version
        id: playwright-version
        working-directory: e2e
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}
      # --with-deps only on a miss: its apt step is at the mercy of the Ubuntu
      # mirrors (svastha and hounddogreading have each lost several minutes to
      # it), and on a hit the runner image already carries chromium's system
      # libraries. The bare install is a near-instant no-op that heals a
      # partial restore.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: bunx playwright install chromium
      # Saved straight after the install rather than at the end of the job, so
      # a failing shard still leaves the browsers cached for the next run.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      # Builds the app and serves it through the real Worker, so the service
      # worker, the plugin downloads and push all behave as they do in production.
      - run: just test-e2e --shard=${{ matrix.shard }}/2
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            test-results
            ~/.config/.wrangler/logs
          retention-days: 7

  # The shards report as `e2e (1)` and `e2e (2)`, which no branch rule can name
  # ahead of time. This is the check that can be required: one name, green only
  # if every shard was.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: e2e-shard
    if: always()
    steps:
      - name: Check the shards
        run: |
          echo "shards: ${{ needs.e2e-shard.result }}"
          [ "${{ needs.e2e-shard.result }}" = "success" ]

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: >-
          Also deploy current main to Cloudflare. For when a deploy failed on a
          release and re-running the original would only replay the same broken
          snapshot.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Opens and updates a release PR from the conventional-commit history. Merging
  # that PR cuts the tag and the GitHub release, and sets release_created.
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          # A PR opened with GITHUB_TOKEN gets no CI run until someone approves
          # it by hand, and the release PR has required checks. This token opens
          # it as a user instead. Without the secret it falls back to
          # GITHUB_TOKEN and the old behaviour.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please stamps the new version into the manifests it is told
      # about, but it cannot touch Cargo.lock — so the release PR would open
      # with a stale lockfile and fail its own CI. It is refreshed here, in
      # this job, so the release PR never sits stale between two workflows.
      - name: Check out the release PR branch
        if: steps.rp.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJson(steps.rp.outputs.pr).headBranchName }}
          # Same token as release-please, so the lockfile push below re-runs CI
          # on the commit the release PR will actually merge.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Install Rust
        if: steps.rp.outputs.prs_created == 'true'
        run: rustup toolchain install stable --profile minimal

      # Re-resolves only the workspace members whose versions just moved;
      # third-party dependency versions are left where they are.
      - name: Refresh Cargo.lock
        if: steps.rp.outputs.prs_created == 'true'
        working-directory: rust
        run: cargo update --workspace

      # This cannot loop: the push goes to the release branch and this workflow
      # runs only on main. A re-run finds a clean lockfile and skips the commit.
      - name: Commit the refreshed lockfile
        if: steps.rp.outputs.prs_created == 'true'
        run: |
          if [ -n "$(git status --porcelain rust/Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rust/Cargo.lock
            git commit -m "chore: refresh Cargo.lock for release"
            git push origin HEAD:${{ fromJson(steps.rp.outputs.pr).headBranchName }}
          fi

  # Builds the app and pushes it, with the relay, to Cloudflare. One deploy:
  # the Worker serves the built app as static assets and owns only /api and /ws,
  # so the client and the relay are always the same version as each other.
  #
  # Runs in the same workflow run as the release, which is what lets it see a
  # release that release-please just cut — a separate workflow would not, since
  # GITHUB_TOKEN pushes trigger nothing.
  #
  # A dispatch does not deploy unless it was asked to. Nudging release-please —
  # the ordinary reason to run this by hand — is otherwise indistinguishable
  # from forcing a release out, and the two want very different amounts of care.
  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.deploy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (wasm32)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.13.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: rust

      - run: just install
      # Deliberately not `just deploy`, which would build again: the build is
      # already done and the committed artifacts must not be regenerated here.
      # Their hashes are pinned in a signed manifest and the signing key is not
      # in this repository, so a rebuilt artifact would ship unsignable bytes.
      - run: just build

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

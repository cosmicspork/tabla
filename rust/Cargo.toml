[workspace]
resolver = "3"
members = [
    "crates/tabla-core",
    "crates/tabla-dawg",
    "crates/tabla-deal",
    "crates/tabla-letras",
    "crates/tabla-plugin-api",
    "crates/tabla-tictactoe",
    "crates/tabla-wasm",
    "crates/tabla-plugin-wasm",
]

[workspace.package]
version = "0.3.0" # x-release-please-version
edition = "2024"
license = "MIT"
repository = "https://github.com/cosmicspork/tabla"

[workspace.dependencies]
tabla-core = { path = "crates/tabla-core" }
tabla-dawg = { path = "crates/tabla-dawg" }
tabla-deal = { path = "crates/tabla-deal" }
tabla-letras = { path = "crates/tabla-letras" }
tabla-plugin-api = { path = "crates/tabla-plugin-api" }
tabla-tictactoe = { path = "crates/tabla-tictactoe" }

ed25519-dalek = { version = "3.0", default-features = false }
x25519-dalek = { version = "3.0", default-features = false }
curve25519-dalek = { version = "5.0", default-features = false }
sha2 = { version = "0.11", default-features = false }
hkdf = { version = "0.13", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false }
argon2 = { version = "0.5", default-features = false }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
zeroize = { version = "1.9", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Argon2 and the curve arithmetic are unusably slow when built unoptimized,
# which would make the test suite take minutes. Optimize dependencies even in
# debug builds; our own crates stay unoptimized for readable backtraces.
[profile.dev.package."*"]
opt-level = 2

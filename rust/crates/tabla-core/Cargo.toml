[package]
name = "tabla-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical encoding, hash-chained log, and protocol crypto for tabla"

# No dependency here may pull `getrandom`. All randomness (seeds, nonces, salts)
# is supplied by the caller, which keeps this crate deterministic, keeps its
# tests reproducible, and avoids needing a JS RNG shim in the wasm build.
[dependencies]
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "zeroize", "alloc", "hazmat"] }
x25519-dalek = { version = "3.0", default-features = false, features = ["precomputed-tables", "zeroize", "static_secrets"] }
sha2 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = { version = "0.13", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[dev-dependencies]
hex = "0.4"
